name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      # The source zip is the committed tree only: no build output, logs or
      # libs/, because git archive honours .gitignore.
      - name: Zip the source
        run: |
          version=$(sed -n 's/^mod_version *= *//p' gradle.properties)
          git archive --format=zip --prefix="strata-$version/" -o "build/libs/strata-$version-sources.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: strata
          path: |
            build/libs/*.jar
            build/libs/*-sources.zip
      # A plain download link for the newest jar of each branch: the release
      # "dev-<branch>", its file replaced on every push.
      - name: Publish the jar to the branch's dev release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" build/libs/*.jar build/libs/*-sources.zip --prerelease --target "$GITHUB_SHA" \
            --title "Strata dev build ($GITHUB_REF_NAME)" --notes "Built from $GITHUB_SHA."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Headless self-tests
        run: ./gradlew runHeadlessSelfTest --no-daemon
